services:
  api:
    build: .
    container_name: sentry_api
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sentry_uploads:/code/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: sentry_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: sentry_db
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: sentry_maintenance
    volumes:
      - sentry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry -d sentry_maintenance"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sentry_pgdata:
  sentry_uploads:
